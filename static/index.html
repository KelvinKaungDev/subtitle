<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myanmar Dub</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2230; --muted:#667085; --line:#e3e6ec;
          --accent:#3b5bdb; --ok:#2b8a3e; --err:#c92a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161b; --card:#1d2027; --text:#e8eaf0; --muted:#9aa3b2; --line:#2e333d;
            --accent:#748ffc; --ok:#69db7c; --err:#ff8787; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, "Myanmar Sangam MN", "Noto Sans Myanmar", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:0 0 16px; } h1 a { color:inherit; text-decoration:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin-bottom:16px; }
  input[type=text], textarea { width:100%; padding:9px 11px; border:1px solid var(--line);
          border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 16px;
          font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
  button.secondary, .btn.secondary { background:transparent; color:var(--accent);
          border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); font-size:13px; }
  .job { display:flex; justify-content:space-between; gap:12px; padding:10px 0;
         border-top:1px solid var(--line); cursor:pointer; }
  .job:first-child { border-top:0; }
  .badge { font-size:12px; padding:2px 9px; border-radius:99px; border:1px solid var(--line);
           white-space:nowrap; }
  .badge.error { color:var(--err); border-color:var(--err); }
  .badge.done { color:var(--ok); border-color:var(--ok); }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:var(--accent); transition:width .3s; }
  .error-box { border:1px solid var(--err); color:var(--err); border-radius:8px;
               padding:10px 12px; margin:10px 0; white-space:pre-wrap; }
  .warn-box { border:1px solid #f08c00; color:#e67700; border-radius:8px; padding:8px 12px; margin:10px 0; }
  .review { display:grid; grid-template-columns: 360px 1fr; gap:16px; align-items:start; }
  @media (max-width: 800px) { .review { grid-template-columns:1fr; } }
  .player { position:sticky; top:12px; }
  video { width:100%; max-height:70vh; background:#000; border-radius:8px; }
  #live { min-height:44px; margin-top:8px; text-align:center; font-size:17px; }
  .seg { display:grid; grid-template-columns:78px 1fr; gap:6px 12px; padding:10px 0;
         border-top:1px solid var(--line); }
  .seg.active { background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .time { font:12px ui-monospace, monospace; color:var(--accent); cursor:pointer; padding-top:3px; }
  .en { color:var(--muted); cursor:pointer; }
  textarea.my { grid-column:2; min-height:42px; resize:vertical; font-size:16px; }
  .saved { font-size:12px; color:var(--ok); }
  pre.prompt { max-height:200px; overflow:auto; background:var(--bg); padding:10px; border-radius:8px;
               white-space:pre-wrap; font-size:12px; border:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1><a href="#/">Myanmar Dub</a></h1>
  <div id="app"></div>
</main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
let timer = null, segTimes = [], actionPending = false, actionStart = 0;

async function api(path, opts) {
  const r = await fetch('/api' + path, opts && {
    method: opts.method, headers: {'Content-Type':'application/json'},
    body: JSON.stringify(opts.body) });
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => { const m = Math.floor(t/60), s = (t%60).toFixed(1).padStart(4,'0'); return `${m}:${s}`; };
const LABEL = {downloading:'Downloading', transcribing:'Getting English text', translating:'Needs translation',
  waiting_review:'Ready to review', rendering:'Exporting', done:'Done', error:'Error'};
const LANGNAME = {my:'Burmese', en:'English'};
const langChip = j => `<span class="badge">${LANGNAME[j.subtitle_lang || 'my']}</span> `;
const badge = j => `<span class="badge ${j.state}">${LABEL[j.state]||j.state}</span>`;

function route() {
  clearInterval(timer);
  const m = location.hash.match(/^#\/job\/(.+)$/);
  m ? showJob(m[1]) : showHome();
}
window.addEventListener('hashchange', route);

/* ---------- home ---------- */
async function showHome() {
  app.innerHTML = `
    <div class="card">
      <div class="row"><input type="text" id="url" placeholder="Paste a YouTube link (video or Short)" style="flex:1;min-width:240px">
      </div>
      <div class="row" style="margin-top:10px">
        <button id="go-my">Make Burmese subtitles</button>
        <button id="go-en" class="secondary">Make English subtitles</button></div>
      <div class="muted" style="margin-top:6px">Burmese = translated from the English speech. English = the English words as spoken (no translation).</div>
      <div id="homeErr"></div>
    </div>
    <div class="card"><b>Jobs</b><div id="list" class="muted">Loading…</div></div>`;
  const start = lang => async () => {
    try {
      const {id} = await api('/jobs', {method:'POST', body:{url:$('#url').value, lang}});
      location.hash = '#/job/' + id;
    } catch (e) { $('#homeErr').innerHTML = `<div class="error-box">${esc(e.message)}</div>`; }
  };
  $('#go-my').onclick = start('my');
  $('#go-en').onclick = start('en');
  $('#url').addEventListener('keydown', e => e.key === 'Enter' && $('#go-my').click());
  const refresh = async () => {
    const list = await api('/jobs');
    $('#list').innerHTML = list.length ? list.map(j => `
      <div class="job" onclick="location.hash='#/job/${j.id}'">
        <div><div>${esc(j.title || j.url)}</div><div class="muted">${esc(j.message||'')}</div></div>
        <div>${langChip(j)}${badge(j)}</div></div>`).join('') : 'No jobs yet. Paste a link above.';
  };
  refresh(); timer = setInterval(refresh, 3000);
}

/* ---------- one job ---------- */
async function showJob(id) {
  app.innerHTML = `<div id="top"></div><div id="body"></div>`;
  let lastState = null;
  const refresh = async () => {
    let job;
    try { job = await api('/jobs/' + id); } catch (e) { app.innerHTML = `<div class="error-box">${esc(e.message)}</div>`; return; }
    $('#top').innerHTML = `<div class="card">
        <div class="row" style="justify-content:space-between"><b>${esc(job.title || job.url)}</b><div>${langChip(job)}${badge(job)}</div></div>
        <div class="muted">${esc(job.message||'')}</div>
        ${['downloading','transcribing','rendering'].includes(job.state) ?
          `<div class="bar"><div style="width:${job.progress||5}%"></div></div>` : ''}
        ${job.state==='error' ? `<div class="error-box">${esc(job.message)}</div>` : ''}
        <div class="row" style="margin-top:8px"><a class="muted" href="#/">← all jobs</a></div></div>`;
    const key = job.state + JSON.stringify(job.files);
    if ($('#vid') && (actionPending || job.state === 'rendering')) {
      updateActions(job);                       // keep the review screen; just update the status + links
      lastState = key;
    } else if (key !== lastState) {
      lastState = key; await renderBody(job);
    }
  };
  await refresh(); timer = setInterval(refresh, 1500);
}

async function renderBody(job) {
  const body = $('#body'), id = job.id;
  const busy = ['downloading','transcribing'].includes(job.state);
  if (busy) { body.innerHTML = ''; return; }
  if (job.state === 'error' && !job.files.original) { body.innerHTML = ''; return; }
  const segs = await api(`/jobs/${id}/segments`);
  if (!segs.length) { body.innerHTML = ''; return; }
  const en = job.subtitle_lang === 'en';
  const translated = en || segs.some(s => s.my);
  let html = '';
  if (!en && (!translated || job.state === 'translating' || job.state === 'error')) html += translatePanel(job);
  if (translated) html += reviewPanel(job, segs);
  body.innerHTML = html;
  if (translated) { wireReview(job, segs); updateActions(job); } else wireTranslate(job);
}

function translatePanel(job) {
  return `<div class="card"><b>Translate to Burmese</b>
    <p class="muted">${'Choose how to translate. Option A is automatic (uses your OpenAI key). Option B is manual: copy a prompt into claude.ai and paste the answer back.'}</p>
    <div class="row"><button id="tr-openai">A) Translate with OpenAI</button>
    <button class="secondary" id="tr-manual">B) Manual Claude mode</button></div>
    <div id="manual" style="display:none;margin-top:14px">
      <div class="muted">1. Copy this prompt and paste it into claude.ai:</div>
      <pre class="prompt" id="promptText">Loading…</pre>
      <button class="secondary" id="copy">Copy prompt</button>
      <div class="muted" style="margin-top:12px">2. Paste Claude's JSON answer here:</div>
      <textarea id="answer" rows="6" placeholder='{"1": "…", "2": "…"}'></textarea>
      <div class="row" style="margin-top:8px"><button id="apply">Apply answer</button></div>
    </div><div id="trErr"></div></div>`;
}
function wireTranslate(job) {
  const err = m => $('#trErr').innerHTML = m ? `<div class="error-box">${esc(m)}</div>` : '';
  $('#tr-openai').onclick = async () => {
    err(''); $('#tr-openai').disabled = true; $('#tr-openai').textContent = 'Translating…';
    try { await api(`/jobs/${job.id}/translate`, {method:'POST', body:{mode:'openai'}}); } catch (e) { err(e.message); }
  };
  $('#tr-manual').onclick = async () => {
    $('#manual').style.display = 'block';
    $('#promptText').textContent = (await api(`/jobs/${job.id}/prompt`)).prompt;
  };
  $('#copy').onclick = async () => { await navigator.clipboard.writeText($('#promptText').textContent); $('#copy').textContent = 'Copied ✓'; };
  $('#apply').onclick = async () => {
    err('');
    try { await api(`/jobs/${job.id}/translate`, {method:'POST', body:{mode:'manual', answer:$('#answer').value}}); }
    catch (e) { err(e.message); }
  };
}

function dlLinks(job) {
  const f = job.files || {}, en = job.subtitle_lang === 'en';
  const a = (kind, label) => `<a class="btn secondary" href="/api/jobs/${job.id}/download/${kind}" download>${label}</a>`;
  return [f.srt && a('srt', en ? 'english.srt' : 'burmese.srt'), f.soft && a('soft', 'mp4 with soft subs'),
          f.burned && a('burned', 'burned-in mp4')].filter(Boolean).join('');
}

function updateActions(job) {
  const msg = $('#actionMsg'); if (!msg) return;
  const running = job.state === 'rendering';
  const finished = actionPending && !running && (job.state === 'done' || job.state === 'error')
                   && job.updated * 1000 >= actionStart;
  if (finished) actionPending = false;
  $('#dl').innerHTML = dlLinks(job);
  [$('#export'), $('#render')].forEach(b => b && (b.disabled = running || actionPending));
  if (running || actionPending) { msg.className = 'muted'; msg.textContent = `⏳ ${job.message || 'Working'}… ${job.progress ? job.progress + '%' : ''}`; }
  else if (finished && job.state === 'done') { msg.className = 'saved'; msg.textContent = `✓ ${job.message} - download below`; }
  else if (finished && job.state === 'error') { msg.className = 'error-box'; msg.textContent = job.message; }
}

function reviewPanel(job, segs) {
  const f = job.files || {};
  const L = job.subtitle_lang === 'en' ? 'en' : 'my', en = L === 'en';
  const srtName = en ? 'english.srt' : 'burmese.srt';
  const warn = (job.warnings||[]).length ? `<div class="warn-box">${job.warnings.map(esc).join('<br>')}</div>` : '';
  return `${warn}<div class="review">
    <div class="player card"><video id="vid" src="/api/jobs/${job.id}/video" controls playsinline></video>
      <div id="live" class="muted">Click a line to jump to it</div>
      <div class="row" style="margin-top:10px">
        <button id="export">Save &amp; export .srt + soft-sub mp4</button>
      </div>
      <div class="row" style="margin-top:12px">
        <label class="muted">Subtitle height
          <select id="burnPos"><option value="0.07">Bottom</option><option value="0.20">Raised</option>
          <option value="0.32">High</option></select></label>
        <label class="muted"><input type="checkbox" id="burnBox"> Black box behind text</label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="render">Render burned-in video</button>
      </div>
      <div id="actionMsg" class="muted" style="margin-top:8px"></div>
      <div id="dl" class="row" style="margin-top:8px">${dlLinks(job)}</div>
      <div class="muted" style="margin-top:4px">Burned-in = subtitles drawn on the picture; plays everywhere (QuickTime, phone). Tip: if the video already has English text at the bottom, choose Raised or use the black box.</div>
      <div class="muted" style="margin-top:6px">Edits save automatically as you type.</div>
      <div class="row" style="margin-top:10px">${en ? '' : '<button class="secondary" id="retr">Translate again…</button>'}</div></div>
    <div class="card"><b>Review ${en ? "English" : "Burmese"} subtitles</b>
      ${segs.map(s => `<div class="seg" id="seg${s.id}">
        <div class="time" data-t="${s.start}">${fmt(s.start)}</div>
        ${en ? '' : `<div class="en" data-t="${s.start}">${esc(s.en)}</div>`}
        <textarea class="my" data-id="${s.id}" rows="2">${esc(s[L])}</textarea></div>`).join('')}
    </div></div>`;
}
function wireReview(job, segs) {
  const L = job.subtitle_lang === 'en' ? 'en' : 'my';
  const vid = $('#vid'), live = $('#live');
  segTimes = segs;
  const jump = t => { vid.currentTime = t; vid.play(); };
  document.querySelectorAll('.time,.en').forEach(el => el.onclick = () => jump(+el.dataset.t));
  const saveTimers = {};
  document.querySelectorAll('textarea.my').forEach(ta => {
    ta.oninput = () => {
      const id = ta.dataset.id; segs.find(s => s.id == id)[L] = ta.value;
      clearTimeout(saveTimers[id]);
      saveTimers[id] = setTimeout(() => api(`/jobs/${job.id}/segments/${id}`, {method:'PUT', body:{my:ta.value}}), 500);
    };
    ta.onfocus = () => { const s = segs.find(s => s.id == ta.dataset.id); vid.currentTime = s.start; };
  });
  vid.ontimeupdate = () => {
    const t = vid.currentTime, cur = segs.find(s => t >= s.start && t < s.end);
    document.querySelectorAll('.seg.active').forEach(e => e.classList.remove('active'));
    if (cur) { $('#seg' + cur.id).classList.add('active'); live.className = ''; live.textContent = cur[L] || cur.en; }
    else live.textContent = '';
  };
  // Save every edit in ONE request, run the action, and always tell the user what happened.
  const act = async (label, fn) => {
    const msg = $('#actionMsg');
    [$('#export'), $('#render')].forEach(b => b.disabled = true);
    msg.className = 'muted'; msg.textContent = 'Saving your edits…';
    Object.values(saveTimers).forEach(clearTimeout);
    try {
      const texts = {}; segs.forEach(s => texts[s.id] = s[L] || '');
      await api(`/jobs/${job.id}/segments`, {method:'PUT', body:{texts}});
      actionStart = Date.now() - 1000;
      await fn();
      actionPending = true;
      msg.textContent = `⏳ ${label}…`;
    } catch (e) {
      actionPending = false;
      msg.className = 'error-box'; msg.textContent = 'Could not ' + label.toLowerCase() + ': ' + e.message;
      [$('#export'), $('#render')].forEach(b => b.disabled = false);
    }
  };
  $('#export').onclick = () => act('Exporting subtitles', () => api(`/jobs/${job.id}/export`, {method:'POST'}));
  api('/settings').then(s => {
    const sel = $('#burnPos'); const opts = [...sel.options].map(o => +o.value);
    sel.value = opts.reduce((a, b) => Math.abs(b - s.burn_bottom_margin) < Math.abs(a - s.burn_bottom_margin) ? b : a);
    $('#burnBox').checked = s.burn_background === 'box';
  });
  $('#render').onclick = () => act('Rendering burned-in video', async () => {
    await api('/settings', {method:'PUT', body:{burn_bottom_margin:+$('#burnPos').value,
                                                 burn_background:$('#burnBox').checked ? 'box' : 'none'}});
    await api(`/jobs/${job.id}/render`, {method:'POST'});
  });
  if ($('#retr')) $('#retr').onclick = () => { $('#body').insertAdjacentHTML('afterbegin', translatePanel(job)); wireTranslate(job);
    $('#retr').disabled = true; };
}
route();
</script>
</body>
</html>
